<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSec Academy — Courses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .table { color: #e6edf3; }
    .table thead { background: #21262d; }
    .table-hover tbody tr:hover { background: #1f2937; }
    .navbar { background: #010409 !important; border-bottom: 1px solid #30363d; }
    .form-control, .form-select, .form-control:focus {
      background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    }
    .modal-content { background: #161b22; border: 1px solid #30363d; }
    .course-card {
      background: #161b22; border: 1px solid #30363d; border-radius: .75rem;
      transition: transform .2s, border-color .2s; height: 100%;
    }
    .course-card:hover { transform: translateY(-4px); border-color: #58a6ff; }
    .level-beginner { background:#198754; }
    .level-intermediate { background:#ffc107; color:#000; }
    .level-advanced { background:#dc3545; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-3">
  <a class="navbar-brand" href="index.html">
    <i class="bi bi-shield-lock-fill text-info"></i> CyberSec Academy
  </a>
  <div class="ms-auto d-flex gap-2">
    <a href="index.html" class="btn btn-sm btn-outline-light">
      <i class="bi bi-people"></i> Users
    </a>
    <span class="badge bg-primary align-self-center">Courses</span>
  </div>
</nav>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-journal-code"></i> Course Management</h3>
    <div>
      <button class="btn btn-outline-info me-2" onclick="toggleView()" id="viewToggle">
        <i class="bi bi-grid-3x3-gap"></i> Grid
      </button>
      <button class="btn btn-primary" onclick="openCreateModal()">
        <i class="bi bi-plus-circle"></i> Tambah Course
      </button>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-5">
      <input type="text" id="searchInput" class="form-control"
             placeholder="Cari judul course..." onkeyup="debouncedLoad()">
    </div>
    <div class="col-md-3">
      <select id="levelFilter" class="form-select" onchange="loadCourses()">
        <option value="">Semua Level</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </div>
    <div class="col-md-2">
      <select id="statusFilter" class="form-select" onchange="loadCourses()">
        <option value="">Semua Status</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-secondary w-100" onclick="loadCourses()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
  </div>

  <div id="gridView" class="row g-3">
    <div class="col-12 text-center py-5">
      <div class="spinner-border text-info"></div>
    </div>
  </div>

  <div id="tableView" class="card d-none">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>#</th><th>Judul</th><th>Level</th>
            <th>Durasi</th><th>Status</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="courseTable"></tbody>
      </table>
    </div>
  </div>

  <nav class="mt-3">
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>
</div>

<div class="modal fade" id="courseModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Tambah Course</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="courseForm">
          <input type="hidden" id="courseId">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Judul Course</label>
              <input type="text" class="form-control" id="courseTitle" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Kategori</label>
              <select class="form-select" id="courseCategory">
                <option value="offensive">Offensive</option>
                <option value="defensive">Defensive</option>
                <option value="forensics">Forensics</option>
                <option value="general">General</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Deskripsi</label>
              <textarea class="form-control" id="courseDesc" rows="3"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Level</label>
              <select class="form-select" id="courseLevel" required>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Durasi (jam)</label>
              <input type="number" class="form-control" id="courseDuration" min="1" value="10">
            </div>
            <div class="col-md-4">
              <label class="form-label">Harga (Rp)</label>
              <input type="number" class="form-control" id="coursePrice" min="0" value="0">
            </div>
            <div class="col-md-8">
              <label class="form-label">Thumbnail URL</label>
              <input type="url" class="form-control" id="courseThumb" placeholder="https://...">
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="coursePublished">
                <label class="form-check-label">Published</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="saveCourse()">
          <i class="bi bi-save"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Hapus Course</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Yakin hapus course <strong id="deleteName"></strong>?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-danger" onclick="confirmDelete()">
          <i class="bi bi-trash"></i> Hapus
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-bg-success border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg">OK</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/courses.js"></script>
</body>
</html>
