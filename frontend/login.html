<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CyberSec Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#0d1117; color:#e6edf3; min-height:100vh;
           display:flex; align-items:center; justify-content:center; }
    .login-card { background:#161b22; border:1px solid #30363d; border-radius:1rem;
                  padding:2rem; width:100%; max-width:400px; }
    .form-control { background:#0d1117; border:1px solid #30363d; color:#e6edf3; }
    .form-control:focus { background:#0d1117; color:#e6edf3; border-color:#58a6ff;
                          box-shadow:0 0 0 .2rem rgba(88,166,255,.25); }
    .brand-icon { font-size:3rem; color:#58a6ff; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock-fill brand-icon"></i>
    <h4 class="mt-2 mb-0">CyberSec Academy</h4>
    <small class="text-muted">Sign in to continue</small>
  </div>

  <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" data-mode="login">Login</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" data-mode="register">Register</a>
    </li>
  </ul>

  <form id="authForm">
    <div class="mb-3" id="nameField" style="display:none">
      <label class="form-label">Nama Lengkap</label>
      <input type="text" class="form-control" id="fullName">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required
             placeholder="admin@cybersec.id">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required
             placeholder="••••••••">
    </div>
    <button class="btn btn-primary w-100" type="submit" id="submitBtn">
      <i class="bi bi-box-arrow-in-right"></i> Login
    </button>
  </form>

  <div class="alert alert-danger mt-3 d-none" id="errorBox"></div>

  <div class="text-center mt-3 small text-muted">
    <div>Demo: <code>admin@cybersec.id</code> / <code>admin123</code></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = "http://localhost:8000/api/v1";
let mode = "login";

document.querySelectorAll("#authTabs .nav-link").forEach(a => {
  a.addEventListener("click", e => {
    e.preventDefault();
    document.querySelectorAll("#authTabs .nav-link").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    mode = a.dataset.mode;
    document.getElementById("nameField").style.display = mode === "register" ? "block" : "none";
    document.getElementById("submitBtn").innerHTML = mode === "register"
      ? '<i class="bi bi-person-plus"></i> Register'
      : '<i class="bi bi-box-arrow-in-right"></i> Login';
    document.getElementById("errorBox").classList.add("d-none");
  });
});

document.getElementById("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("errorBox");
  err.classList.add("d-none");

  const payload = {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  };
  if (mode === "register") payload.full_name = document.getElementById("fullName").value;

  const url = mode === "register" ? `${API_BASE}/auth/register` : `${API_BASE}/auth/login`;

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Gagal");
    localStorage.setItem("access_token", data.access_token);
    localStorage.setItem("user", JSON.stringify(data.user));
    window.location.href = "dashboard.html";
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove("d-none");
  }
});
</script>
</body>
</html>
