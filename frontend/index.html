<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSec Academy — User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .table { color: #e6edf3; }
    .table thead { background: #21262d; }
    .table-hover tbody tr:hover { background: #1f2937; }
    .navbar { background: #010409 !important; border-bottom: 1px solid #30363d; }
    .badge-admin { background: #dc3545; }
    .badge-student { background: #0d6efd; }
    .badge-instructor { background: #198754; }
    .form-control, .form-select {
      background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    }
    .form-control:focus, .form-select:focus {
      background: #0d1117; color: #e6edf3; border-color: #58a6ff;
      box-shadow: 0 0 0 0.2rem rgba(88,166,255,.25);
    }
    .modal-content { background: #161b22; border: 1px solid #30363d; }
  </style>
</head>
<body>
<script src="js/auth.js"></script>
<nav class="navbar navbar-expand-lg navbar-dark px-3">
  <a class="navbar-brand" href="#">
    <i class="bi bi-shield-lock-fill text-info"></i> CyberSec Academy
  </a>
  <div class="ms-auto"><span class="badge bg-secondary">Admin Panel</span></div>
</nav>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-people-fill"></i> User Management</h3>
    <button class="btn btn-primary" onclick="openCreateModal()">
      <i class="bi bi-plus-circle"></i> Tambah User
    </button>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <input type="text" id="searchInput" class="form-control"
             placeholder="🔍 Cari nama / email..." onkeyup="loadUsers()">
    </div>
    <div class="col-md-3">
      <select id="roleFilter" class="form-select" onchange="loadUsers()">
        <option value="">Semua Role</option>
        <option value="admin">Admin</option>
        <option value="instructor">Instructor</option>
        <option value="student">Student</option>
      </select>
    </div>
    <div class="col-md-3">
      <button class="btn btn-outline-secondary w-100" onclick="loadUsers()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>#</th><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="userTable">
          <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <nav class="mt-3">
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Tambah User</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="userForm">
          <input type="hidden" id="userId">
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="userName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="userEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="userPassword"
                   placeholder="Kosongkan jika tidak diubah">
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" id="userRole" required>
              <option value="student">Student</option>
              <option value="instructor">Instructor</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="userActive" checked>
            <label class="form-check-label">Aktif</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="saveUser()">
          <i class="bi bi-save"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Konfirmasi Hapus</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Yakin ingin menghapus user <strong id="deleteName"></strong>?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-danger" onclick="confirmDelete()">
          <i class="bi bi-trash"></i> Hapus
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-bg-success border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg">Berhasil!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/users.js"></script>
</body>
</html>
